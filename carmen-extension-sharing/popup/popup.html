<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CARMEN</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <section id="setup-view" class="view">
        <header class="header">
          <div class="logo-dot" aria-hidden="true"></div>
          <h1>carmen</h1>
          <span class="state-pill pill" aria-live="polite"></span>
        </header>

        <div class="field">
          <label id="duration-label">Duration</label>
          <div class="preset-row" role="group" aria-labelledby="duration-label">
            <button type="button" class="preset-btn" data-minutes="15"><b>15</b><i>min</i></button>
            <button type="button" class="preset-btn" data-minutes="25"><b>25</b><i>min</i></button>
            <button type="button" class="preset-btn" data-minutes="45"><b>45</b><i>min</i></button>
            <button type="button" class="preset-btn" data-minutes="60"><b>60</b><i>min</i></button>
          </div>
          <input
            type="number"
            id="custom-minutes"
            min="1"
            placeholder="Or type any number of minutes"
            aria-label="Custom minutes"
          />
        </div>

        <div class="field">
          <label>Lock mode</label>
          <div class="lock-toggle">
            <button type="button" class="lock-card selected" id="lock-soft" data-mode="soft">
              <span class="lock-title">Soft Lock</span>
              <span class="lock-desc">Warns for 3 seconds, then lets you stay.</span>
            </button>
            <button type="button" class="lock-card" id="lock-hard" data-mode="hard">
              <span class="lock-title">Hard Lock</span>
              <span class="lock-desc">Sends you straight back. No warning.</span>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="whitelist">Allowed websites</label>
          <textarea
            id="whitelist"
            rows="3"
            placeholder="github.com&#10;docs.google.com&#10;stackoverflow.com"
          ></textarea>
          <span class="hint">One domain or URL fragment per line.</span>
        </div>

        <button type="button" id="start-btn" class="primary-btn">
          Start Focus Session
        </button>

        <button type="button" id="review-additions-btn" class="ghost-btn review-additions-btn hidden">
          Add sites from last session
        </button>
      </section>

      <section id="active-view" class="view hidden">
        <header class="header">
          <div class="logo-dot" aria-hidden="true"></div>
          <h1>carmen</h1>
          <span class="state-pill pill" aria-live="polite"></span>
        </header>

        <div class="countdown" id="countdown">00:00</div>

        <div class="badge-row">
          <div class="lock-mode-badge" id="lock-mode-badge">Soft Lock</div>
          <div class="lock-mode-badge paused-badge hidden" id="paused-badge">Paused</div>
        </div>

        <button type="button" id="pause-btn" class="secondary-btn pause-btn">
          Pause Timer
        </button>

        <div class="violations-row">
          <span class="violations-count" id="violations-count">0 violations</span>
          <button type="button" id="view-log-btn" class="ghost-btn">View full log</button>
        </div>

        <div class="field">
          <label id="allowed-sites-label">Allowed sites</label>
          <ul class="allowed-sites" id="allowed-sites" tabindex="0" aria-labelledby="allowed-sites-label"></ul>
        </div>

        <div class="field">
          <label for="add-site-input">Add a site for now</label>
          <div class="add-site-row">
            <input type="text" id="add-site-input" placeholder="e.g. wikipedia.org" />
            <button type="button" id="add-site-btn" class="secondary-btn">Add</button>
          </div>
          <div id="add-site-reason-row" class="hidden">
            <textarea
              id="add-site-reason"
              rows="2"
              placeholder="Why do you need this site right now?"
            ></textarea>
            <div class="add-site-actions">
              <button type="button" id="add-site-cancel-btn" class="ghost-btn">
                Cancel
              </button>
              <button type="button" id="add-site-submit-btn" class="secondary-btn">
                Add site
              </button>
            </div>
          </div>
          <span class="hint" id="add-site-status"></span>
        </div>

        <button type="button" id="nuclear-btn" class="nuclear-btn">
          Nuclear — End Session Now
        </button>
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
