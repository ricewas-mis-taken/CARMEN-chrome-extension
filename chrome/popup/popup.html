<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CARMEN</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="logo-dot"></div>
        <h1>CARMEN</h1>
      </header>

      <div class="info-chip review-chip hidden" id="review-progress-banner">
        <div class="info-chip-row" id="review-progress-row">
          <span class="review-progress-icon">🔁</span>
          <span class="info-chip-label" id="review-progress-title"></span>
          <span class="info-chip-time" id="review-progress-elapsed"></span>
          <span class="info-chip-chevron">▾</span>
        </div>
        <div class="review-progress-paused-line hidden" id="review-progress-paused-line"></div>
        <div class="info-chip-detail hidden" id="review-progress-detail">
          <div class="review-info-line">
            <span class="review-info-label">Subject</span>
            <span id="review-progress-subject"></span>
          </div>
          <button type="button" class="secondary-btn review-progress-pause-btn" id="review-progress-pause-btn">
            Pause
          </button>
        </div>
      </div>

      <section id="setup-view" class="view">
        <div class="field">
          <label>Duration</label>
          <div class="preset-row">
            <button type="button" class="preset-btn" data-minutes="15">15m</button>
            <button type="button" class="preset-btn" data-minutes="25">25m</button>
            <button type="button" class="preset-btn" data-minutes="45">45m</button>
            <button type="button" class="preset-btn" data-minutes="60">60m</button>
          </div>
          <input
            type="number"
            id="custom-minutes"
            min="1"
            placeholder="Custom minutes"
          />
        </div>

        <div class="field">
          <label>Lock mode</label>
          <div class="lock-toggle">
            <button type="button" class="lock-card selected" id="lock-soft" data-mode="soft">
              <span class="lock-title">Soft Lock</span>
              <span class="lock-desc">Shows a 3-second warning, then lets you stay.</span>
            </button>
            <button type="button" class="lock-card" id="lock-hard" data-mode="hard">
              <span class="lock-title">Hard Lock</span>
              <span class="lock-desc">Instantly redirects you back, no warning.</span>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="whitelist">Websites</label>
          <textarea
            id="whitelist"
            rows="3"
            placeholder="github.com&#10;docs.google.com&#10;stackoverflow.com"
          ></textarea>
          <span class="hint">One domain or URL substring per line.</span>
          <div class="whitelist-save-row">
            <button type="button" id="save-whitelist-btn" class="secondary-btn">
              Save Websites
            </button>
            <span class="hint" id="save-whitelist-status"></span>
          </div>
        </div>

        <button type="button" id="start-btn" class="primary-btn">
          Start Focus Session
        </button>

        <button type="button" id="review-additions-btn" class="ghost-btn review-additions-btn hidden">
          Add sites from last session
        </button>

        <button type="button" id="setup-view-log-btn" class="ghost-btn">
          View Session History
        </button>

        <div class="field">
          <label for="api-token-input">Desktop app pairing</label>

          <div class="device-link-card linked hidden" id="device-link-linked">
            <div class="device-link-status">
              <span class="device-link-dot"></span>
              <span>Desktop Linked</span>
            </div>
            <div class="device-link-name" id="device-link-name"></div>
            <button type="button" id="device-unlink-btn" class="device-link-change-btn">
              Change token
            </button>
          </div>

          <div class="device-link-card unlinked" id="device-link-unlinked">
            <input
              type="text"
              id="api-token-input"
              placeholder="Paste API token from the tray menu"
              autocomplete="off"
            />
            <span class="hint">Tray menu -> Copy API Token. One-time, per browser profile.</span>
            <div class="whitelist-save-row">
              <button type="button" id="save-api-token-btn" class="secondary-btn">
                Save Token
              </button>
              <span class="hint" id="api-token-status"></span>
            </div>
          </div>
        </div>

        <button type="button" id="screentime-btn" class="ghost-btn">
          Screen Time
        </button>
      </section>

      <section id="active-view" class="view hidden">
        <div class="allow-suggestion-banner hidden" id="allow-suggestion-banner">
          <span id="allow-suggestion-text"></span>
          <div class="allow-suggestion-actions">
            <button type="button" id="allow-suggestion-yes-btn" class="secondary-btn">Allow</button>
            <button type="button" id="allow-suggestion-dismiss-btn" class="ghost-btn">&times;</button>
          </div>
        </div>

        <div class="countdown-label" id="countdown-label">Time left</div>
        <div class="countdown" id="countdown">00:00</div>

        <div class="badge-row">
          <div class="lock-mode-badge" id="lock-mode-badge">Soft Lock</div>
          <div class="lock-mode-badge paused-badge hidden" id="paused-badge">Paused</div>
          <div class="lock-mode-badge break-badge hidden" id="break-badge">On Break</div>
        </div>

        <div class="event-source-row hidden" id="event-source-row">
          <span class="event-source-icon" id="event-source-icon">📅</span>
          <span class="event-source-title" id="event-source-title"></span>
        </div>

        <div class="info-chip hidden" id="pomodoro-info">
          <div class="info-chip-row" id="pomodoro-chip-row">
            <span class="info-chip-label">Pomodoro</span>
            <span class="info-chip-time" id="pomodoro-chip-time"></span>
            <span class="info-chip-chevron">▾</span>
          </div>
          <div class="info-chip-detail hidden" id="pomodoro-chip-detail">
            <div class="review-info-line">
              <span class="review-info-label">Cycle</span>
              <span id="pomodoro-cycle-text"></span>
            </div>
          </div>
        </div>

        <div class="review-info hidden" id="review-info">
          <div class="review-info-line">
            <span class="review-info-label">Task</span>
            <span id="review-info-task"></span>
          </div>
          <div class="review-info-line">
            <span class="review-info-label">Review</span>
            <span id="review-info-name"></span>
          </div>
          <div class="review-info-line hidden" id="review-info-subject-line">
            <span class="review-info-label">Subject</span>
            <span id="review-info-subject"></span>
          </div>
        </div>

        <div class="browser-only-row hidden" id="browser-only-row">
          <span class="browser-only-icon">⚠️</span>
          <span>Browser-only session — desktop app unreachable, no sync.</span>
        </div>

        <button type="button" id="pause-btn" class="secondary-btn pause-btn">
          Pause Timer
        </button>

        <div class="violations-row">
          <span class="violations-count" id="violations-count">0 violations</span>
          <button type="button" id="view-log-btn" class="ghost-btn">View Full Log</button>
        </div>

        <div class="field">
          <label>Allowed sites</label>
          <ul class="allowed-sites" id="allowed-sites"></ul>
        </div>

        <div class="field">
          <label for="add-site-input">Add a site</label>
          <div class="add-site-row">
            <input type="text" id="add-site-input" placeholder="e.g. wikipedia.org" />
            <button type="button" id="add-site-btn" class="secondary-btn">Add</button>
          </div>
          <div id="add-site-reason-row" class="hidden">
            <textarea
              id="add-site-reason"
              rows="2"
              placeholder="Why do you need this site right now?"
            ></textarea>
            <div class="add-site-actions">
              <button type="button" id="add-site-cancel-btn" class="ghost-btn">
                Cancel
              </button>
              <button type="button" id="add-site-submit-btn" class="secondary-btn">
                Submit reason
              </button>
            </div>
          </div>
          <span class="hint" id="add-site-status"></span>
        </div>

        <button type="button" id="nuclear-btn" class="nuclear-btn">
          Nuclear — End Session Now
        </button>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
