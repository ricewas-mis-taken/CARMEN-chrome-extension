<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Carmen · Screen time</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="screentime.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="logo-dot" aria-hidden="true"></div>
        <h1>Screen time</h1>
      </header>

      <p class="hint">
        Websites only. The desktop app also tracks app time; its Screen Time tab shows both.
      </p>

      <div id="category-warning" class="category-warning">
        <span>Site categories failed to load, so every site is showing as Other.</span>
        <button type="button" id="category-retry-btn">Retry</button>
      </div>

      <div class="range-toggle">
        <button type="button" id="range-day-btn" class="range-btn selected">Daily</button>
        <button type="button" id="range-week-btn" class="range-btn">Weekly</button>
      </div>

      <div id="chart" class="chart"></div>

      <div id="sections"></div>
    </div>

    <script src="screentime.js"></script>
  </body>
</html>
